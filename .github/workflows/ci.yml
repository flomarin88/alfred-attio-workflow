name: CI

# PR coverage is provided by pr-checks.yaml (composite health-check action).
# This workflow adds push-on-main coverage so the default branch is verified
# independently. Story 1.1 acceptance criterion.

on:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
